name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.46.1
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/akeru-dev
            git pull origin main
            find . -name "*.pyc" -delete
            find . -name "__pycache__" -type d -exec rm -rf {} + || true
            systemctl restart vanik
            # is-active exits 3 while "activating" — 3s is often too short for Vanik.
            for i in $(seq 1 60); do
              if systemctl is-active --quiet vanik; then
                echo "vanik: active"
                systemctl is-active vanik
                exit 0
              fi
              sleep 2
            done
            echo "vanik: timeout waiting for active (120s)"
            systemctl status vanik --no-pager -l || true
            journalctl -u vanik -n 80 --no-pager || true
            exit 1
