[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanik"
version = "0.1.0"
description = "Vanik tariff intelligence system scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "starlette>=0.37.0",
  "anthropic",
  "openai>=1.0.0",
  "google-generativeai>=0.8.0",
  "sentence-transformers",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "uvicorn>=0.30.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["agent/tests", "nes/tests", "mcp_servers/vanik_api/tests", "mcp_servers/vanik_docs/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "config*", "evaluation*", "mcp_servers*", "nes*"]
